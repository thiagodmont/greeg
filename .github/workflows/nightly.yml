name: nightly
# Full benchmark protocol: the small and medium tiers, the SCIP oracle
# where an indexer is available, a five-hour soak, and the regression gates. Runs
# on the reference machine when a self-hosted runner labelled `reference` is
# registered (repository variable REFERENCE_RUNNER=true); there the gates require
# a baseline (--require-baseline) and cold-cache rows are measured when
# passwordless sudo works. On a hosted runner the numbers are informative only:
# the gates record (--record-only) and cold rows are skipped with a printed reason.
on:
  # Nightly schedule disabled 2026-09-08 (GitHub Actions billing); the workflow
  # still runs on demand from the Actions tab. Uncomment to restore.
  # schedule:
  #   - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: soak duration in minutes
        default: "300"
permissions:
  contents: read
env:
  GREEG_BENCH_CACHE: ${{ github.workspace }}/.bench-cache/corpora
  GATE_MODE: ${{ vars.REFERENCE_RUNNER == 'true' && '--require-baseline' || '--record-only' }}
jobs:
  build:
    runs-on: ${{ vars.REFERENCE_RUNNER == 'true' && fromJSON('["self-hosted","reference"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked -p greeg
      - run: cargo test --workspace --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: greeg-bin-${{ github.run_id }}
          path: target/release/greeg
  kernels:
    runs-on: ${{ vars.REFERENCE_RUNNER == 'true' && fromJSON('["self-hosted","reference"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo bench --locked -p greeg-index --bench kernels -- --noplot
      - run: python3 bench/bench.py gate kernels --tolerance 5 $GATE_MODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-kernels-${{ github.run_id }}
          path: bench/results/
  speed:
    needs: build
    runs-on: ${{ vars.REFERENCE_RUNNER == 'true' && fromJSON('["self-hosted","reference"]') || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: greeg-bin-${{ github.run_id }}
          path: target/release
      - run: chmod +x target/release/greeg
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .bench-cache
          key: corpora-medium-${{ runner.os }}-${{ hashFiles('bench/corpora.toml') }}
      - name: tools (hyperfine, ripgrep, GNU time)
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq hyperfine ripgrep time; fi
          if command -v brew >/dev/null; then brew install hyperfine ripgrep || true; fi
          hyperfine --version; rg --version | head -1
      - run: python3 bench/bench.py fetch tokio ktor django kotlinx-coroutines TypeScript-5.9 TypeScript
      - name: speed (protocol 2; --cold is honoured only where `sudo -n` works, otherwise skipped with a reason)
        run: python3 bench/bench.py speed --corpora tokio,ktor,django,kotlinx-coroutines,TypeScript-5.9,TypeScript --cold --no-splice
      - run: python3 bench/bench.py gate speed --tolerance 10 $GATE_MODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-speed-${{ github.run_id }}
          path: bench/results/
  oracle:
    needs: build
    runs-on: ${{ vars.REFERENCE_RUNNER == 'true' && fromJSON('["self-hosted","reference"]') || 'ubuntu-latest' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: greeg-bin-${{ github.run_id }}
          path: target/release
      - run: chmod +x target/release/greeg
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rust-analyzer
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .bench-cache
          key: corpora-medium-${{ runner.os }}-${{ hashFiles('bench/corpora.toml') }}
      - name: tools (ripgrep, tiktoken)
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep; fi
          if command -v brew >/dev/null; then brew install ripgrep || true; fi
          # a failed install is not fatal, but it must be visible: the oracle JSON and the
          # report record which tokenizer ran (o200k_base or the bytes/3.7 fallback)
          pip3 install --quiet tiktoken || echo "::warning::tiktoken install failed; token counts use the bytes/3.7 fallback (recorded as `tokenizer` in bench/results/oracle.json)"
          python3 -c 'import tiktoken; print("tokenizer: o200k_base")' || echo "::warning::tokenizer: bytes/3.7 fallback"
      - run: python3 bench/bench.py fetch tokio django TypeScript-5.9
      - run: python3 bench/bench.py oracle tokio django TypeScript-5.9
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-oracle-${{ github.run_id }}
          path: bench/results/
  soak:
    needs: build
    runs-on: ${{ vars.REFERENCE_RUNNER == 'true' && fromJSON('["self-hosted","reference"]') || 'ubuntu-latest' }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: greeg-bin-${{ github.run_id }}
          path: target/release
      - run: chmod +x target/release/greeg
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .bench-cache
          key: corpora-small-${{ runner.os }}-${{ hashFiles('bench/corpora.toml') }}
      - name: tools (ripgrep)
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep; fi
          if command -v brew >/dev/null; then brew install ripgrep || true; fi
      - run: python3 bench/bench.py fetch tokio ktor django
      - run: python3 bench/soak.py ${{ github.event.inputs.soak_minutes || 300 }} target/release/greeg $GREEG_BENCH_CACHE/tokio $GREEG_BENCH_CACHE/django $GREEG_BENCH_CACHE/ktor
  report:
    needs: [speed, oracle, soak, kernels]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nightly-*-${{ github.run_id }}
          path: bench/results
          merge-multiple: true
      - run: python3 bench/bench.py report --out bench/results/BENCH.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-${{ github.run_id }}
          path: bench/results/
