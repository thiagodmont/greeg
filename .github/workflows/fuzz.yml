name: fuzz
# Each fuzz target for a while on nightly, starting from its saved seeds. On
# demand only (Actions billing). A crash fails the job and uploads its input;
# reproduce it with `cargo +nightly fuzz run TARGET CRASH-FILE`.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: seconds per target
        required: true
        type: number
        default: 600
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [regex_plan, index_decode, shell_rewrite, lang_extract]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: fuzz ${{ matrix.target }}
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds }}
        # cargo fuzz takes no --locked: fetch with it, then check the lock is unchanged
        run: |
          cargo fetch --locked --manifest-path fuzz/Cargo.toml
          mkdir -p "$RUNNER_TEMP/corpus"
          cargo fuzz run ${{ matrix.target }} "$RUNNER_TEMP/corpus" fuzz/seeds/${{ matrix.target }} -- -max_total_time="$SECONDS_PER_TARGET"
          git diff --exit-code fuzz/Cargo.lock
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
