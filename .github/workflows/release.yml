name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }  # macos-13 images were retired; macos-15-intel is the last Intel runner
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p greeg
      - name: package
        shell: bash
        run: |
          v=${GITHUB_REF_NAME#v}
          name=greeg-$v-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/greeg dist/$name/
          cp README.md LICENSE* dist/$name/ 2>/dev/null || true
          ./target/${{ matrix.target }}/release/greeg man > dist/$name/greeg.1 || true
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && shasum -a 256 $name.tar.gz > $name.tar.gz.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: homebrew formula
        shell: bash
        run: |
          v=${GITHUB_REF_NAME#v}
          sha() { cut -d' ' -f1 "dist/greeg-$v-$1.tar.gz.sha256"; }
          sed -e "s/@VERSION@/$v/g" \
              -e "s/@SHA_ARM_MAC@/$(sha aarch64-apple-darwin)/" \
              -e "s/@SHA_X86_MAC@/$(sha x86_64-apple-darwin)/" \
              -e "s/@SHA_X86_LINUX@/$(sha x86_64-unknown-linux-gnu)/" \
              -e "s/@SHA_ARM_LINUX@/$(sha aarch64-unknown-linux-gnu)/" \
              homebrew/greeg.rb.in > dist/greeg.rb
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: publish the Homebrew tap
        # Needs a TAP_TOKEN repository secret: a fine-grained PAT with "Contents: read and write"
        # on thiagodmont/homebrew-greeg. Without it the step prints a reminder and succeeds.
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        shell: bash
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "TAP_TOKEN not set: copy dist/greeg.rb to thiagodmont/homebrew-greeg/Formula/greeg.rb by hand"
            exit 0
          fi
          v=${GITHUB_REF_NAME#v}
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/thiagodmont/homebrew-greeg.git" tap
          mkdir -p tap/Formula
          cp dist/greeg.rb tap/Formula/greeg.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/greeg.rb
          git commit -m "greeg $v" || { echo "formula unchanged"; exit 0; }
          git push
