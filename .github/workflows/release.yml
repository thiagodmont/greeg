name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }  # macos-13 images were retired; macos-15-intel is the last Intel runner
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p greeg
      - name: package
        shell: bash
        run: |
          v=${GITHUB_REF_NAME#v}
          name=greeg-$v-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/greeg dist/$name/
          cp README.md LICENSE* dist/$name/ 2>/dev/null || true
          ./target/${{ matrix.target }}/release/greeg man > dist/$name/greeg.1 || true
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && shasum -a 256 $name.tar.gz > $name.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: homebrew formula
        shell: bash
        run: |
          v=${GITHUB_REF_NAME#v}
          sha() { cut -d' ' -f1 "dist/greeg-$v-$1.tar.gz.sha256"; }
          sed -e "s/@VERSION@/$v/g" \
              -e "s/@SHA_ARM_MAC@/$(sha aarch64-apple-darwin)/" \
              -e "s/@SHA_X86_MAC@/$(sha x86_64-apple-darwin)/" \
              -e "s/@SHA_X86_LINUX@/$(sha x86_64-unknown-linux-gnu)/" \
              -e "s/@SHA_ARM_LINUX@/$(sha aarch64-unknown-linux-gnu)/" \
              homebrew/greeg.rb.in > dist/greeg.rb
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      # To publish the tap: copy dist/greeg.rb to <owner>/homebrew-greeg/Formula/greeg.rb
      # (a TAP_TOKEN secret and a checkout of the tap repo can automate this step).
