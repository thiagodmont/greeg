name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }  # macos-13 images were retired; macos-15-intel is the last Intel runner
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: tag matches the package version
        shell: bash
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -qx "version = \"$v\"" Cargo.toml || { echo "::error::tag $GITHUB_REF_NAME is not the version in Cargo.toml"; exit 1; }
      - run: cargo build --release --locked --target ${{ matrix.target }} -p greeg
      - name: package
        shell: bash
        run: |
          v=${GITHUB_REF_NAME#v}
          name=greeg-$v-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/greeg README.md LICENSE-MIT dist/$name/
          ./target/${{ matrix.target }}/release/greeg man > dist/$name/greeg.1
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && shasum -a 256 $name.tar.gz > $name.tar.gz.sha256)
      - name: qualify the archive as users get it
        shell: bash
        run: |
          v=${GITHUB_REF_NAME#v}
          name=greeg-$v-${{ matrix.target }}
          mkdir -p qualify
          tar -C qualify -xzf dist/$name.tar.gz
          python3 bench/qualify.py "qualify/$name" "$v" | tee qualify.log
          echo "### ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/    /' qualify.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: archives are the ones the build jobs qualified
        shell: bash
        run: |
          cd dist
          for c in *.tar.gz.sha256; do shasum -a 256 -c "$c"; done
          test "$(ls *.tar.gz | wc -l)" -eq 4
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: homebrew formula
        shell: bash
        run: |
          v=${GITHUB_REF_NAME#v}
          sha() { cut -d' ' -f1 "dist/greeg-$v-$1.tar.gz.sha256"; }
          sed -e "s/@VERSION@/$v/g" \
              -e "s/@SHA_ARM_MAC@/$(sha aarch64-apple-darwin)/" \
              -e "s/@SHA_X86_MAC@/$(sha x86_64-apple-darwin)/" \
              -e "s/@SHA_X86_LINUX@/$(sha x86_64-unknown-linux-gnu)/" \
              -e "s/@SHA_ARM_LINUX@/$(sha aarch64-unknown-linux-gnu)/" \
              homebrew/greeg.rb.in > dist/greeg.rb
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
      - name: publish the Homebrew tap
        # Needs a TAP_TOKEN repository secret: a fine-grained PAT with "Contents: read and write"
        # on thiagodmont/homebrew-greeg. Without it the step prints a reminder and succeeds.
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        shell: bash
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::partial publication: the Homebrew formula was not published (TAP_TOKEN not set); copy dist/greeg.rb to thiagodmont/homebrew-greeg/Formula/greeg.rb by hand"
            exit 0
          fi
          v=${GITHUB_REF_NAME#v}
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/thiagodmont/homebrew-greeg.git" tap
          mkdir -p tap/Formula
          cp dist/greeg.rb tap/Formula/greeg.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/greeg.rb
          git commit -m "greeg $v" || { echo "formula unchanged"; exit 0; }
          git push
