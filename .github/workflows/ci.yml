name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace
      - run: cargo test --workspace
      - run: cargo clippy --all-targets -- -D warnings
      - name: binary size gate (< 25 MB)
        shell: bash
        run: |
          size=$(stat -c %s target/release/greeg 2>/dev/null || stat -f %z target/release/greeg)
          echo "greeg binary: $size bytes"
          test "$size" -lt 26214400
      - name: smoke
        run: |
          ./target/release/greeg --version
          ./target/release/greeg -F "fn main" crates --no-index --budget 400
          ./target/release/greeg doctor --root . || true
  kernels:
    # criterion kernels; the 5 % gate compares against bench/baselines/kernels-<host>.json
    # when a baseline for this host exists (the reference machine), otherwise it records.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p greeg-index --bench kernels -- --warm-up-time 1 --measurement-time 2 --noplot
      - run: python3 bench/bench.py gate kernels --tolerance 5
  e2e:
    # end-to-end on the small corpora (tokio, ktor, django) with a 10 % gate on greeg's
    # search latency and index build time against bench/baselines/speed-<host>.json.
    runs-on: ubuntu-latest
    env:
      GREEG_BENCH_CACHE: ${{ github.workspace }}/.bench-cache/corpora
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .bench-cache
          key: corpora-small-${{ hashFiles('bench/corpora.toml') }}
      - run: sudo apt-get install -y -qq hyperfine ripgrep
      - run: cargo build --release -p greeg
      - run: python3 bench/bench.py fetch tokio ktor django
      - run: python3 bench/parity.py $GREEG_BENCH_CACHE target/release/greeg
      - run: python3 bench/bench.py speed --corpora tokio,ktor,django --runs 5
      - run: python3 bench/bench.py gate speed --tolerance 10
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench/results/
