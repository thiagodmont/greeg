[workspace]
resolver = "3"
members = ["crates/greeg", "crates/greeg-lang", "crates/greeg-query", "crates/greeg-index", "crates/greeg-fsevents"]
exclude = ["spikes"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
bstr = "1"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
memchr = "2"
rayon = "1"
regex = "1"
regex-syntax = "0.8"
roaring = "0.11"
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
hashbrown = "0.15"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tree-sitter = "=0.27.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-kotlin-sg = "=0.4.1"
streaming-iterator = "0.1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"   # the shipped binary; Linux ELFs embed line tables otherwise (47 MB vs 16 MB)

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

[profile.dev]
opt-level = 1
