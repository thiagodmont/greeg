# Pinned benchmark corpora. `bench/bench.py fetch` shallow-clones
# each repository at its SHA into the bench cache ($GREEG_BENCH_CACHE, default
# ~/.cache/greeg-bench/corpora). `size` is the tier used by CI: `small` runs on
# every pull request, everything runs nightly on the reference machine.
#
# Each corpus carries one query per family for the speed protocol. Families:
#   ident   a common identifier (the default, budgeted greeg answer)
#   word    an identifier with -w
#   phrase  a fixed string with -F
#   regex   a pattern with a literal core
#   def / refs / callers   greeg verbs (no rg equivalent; timed for the table)

[tokio]
url = "https://github.com/tokio-rs/tokio"
sha = "ea91b33"
lang = "rust"
size = "small"
[tokio.queries]
ident = "spawn_blocking"
word = "Waker"
phrase = "Pin<&mut Self>"
regex = "\\bpoll_\\w+\\("
def = "JoinHandle"
refs = "Semaphore"
callers = "spawn_blocking"

[ktor]
url = "https://github.com/ktorio/ktor"
sha = "f92fad0"
lang = "kotlin"
size = "small"
[ktor.queries]
ident = "respond"
word = "ApplicationCall"
phrase = "fun respond"
regex = "fun \\w+Call\\("
def = "ApplicationCall"
refs = "ContentNegotiation"
callers = "respond"

