# ripgrep's single-file benchmark subject: one 9.3 GB text file (uncompressed).
# Not a repository; `fetch` downloads and gunzips it. Exercises scan mode only
# (greeg indexes files up to the HUGE cap; this one is searched, not indexed).
[opensubtitles]
url = "https://object.pouta.csc.fi/OPUS-OpenSubtitles/v2018/mono/en.txt.gz"
kind = "file"
size = "large"
[opensubtitles.queries]
ident = "Sherlock Holmes"
word = "Sherlock"
phrase = "Sherlock Holmes"
regex = "\\w+nn\\w+ Holmes"
