filename = "quick-correctness-fixes-2026-09-23-darwin-arm64.json"
title = "Quick correctness fixes: exact-search regression (2026-09-23)"
pr = 24
show_rows = false
notes = "Merged main against the JSON exit status, detached index directory, generated-file, ignore-input digest and regular-file fixes. `--fresh stat` runs the freshness check, including the ignore-input digest, on every query. All 30 cases keep the same exit status and the same stdout once JSON elapsed fields are removed, and every ripgrep comparison passes. Tokens are unchanged except index hit_json, whose first raw sample differs by one byte of timing value. Scan medians change by +0.4% and index medians by +1.8% (median across cases). One p95 flag, scan case_miss_files +36.4% with a +0.5% median, is on a path that never computes the digest. Host load average was 10.8–11.5 from an unrelated workload. The harness records no execution time; the result file was written at 2026-09-23T19:02:41Z."

[[datasets]]
id = "quick_correctness_fixes_confirmation"
section = "matching_review"
filename = "quick-correctness-fixes-confirmation-2026-09-23-darwin-arm64.json"
title = "Quick correctness fixes: confirmation (2026-09-23)"
pr = 24
notes = "Same binaries, 151 pairs. Exit status and elapsed-normalized stdout are unchanged in 30/30 cases, and ripgrep comparisons pass. Token counts are unchanged except the two case_miss_json rows (scan 227 → 224, index 224 → 228), whose first raw samples differ only in elapsed timing values. The earlier scan tail flag does not repeat. The only flag is scan fuzzy_miss_unlimited p95 +20.4% (9.96 → 11.99 ms, +0.5% median), again on the scan path. Index medians rise by +0.9% (+0.066 ms) across cases, with a range of −0.5% to +3.4%: the cost of the per-check ignore digest and the descriptor type check on candidate reads, accepted as a safety cost. The harness uses a private HOME (no global git config) and a synthetic 256-file warm corpus, so these numbers exclude reading global git configs: each check reads every existing config in full to find excludesFile, and deeper trees add stat calls for ancestor ignore files. No cold-cache, RSS or large-repository claim is made. The result file was written at 2026-09-23T19:04:58Z; load average was 9.5–13.3."

