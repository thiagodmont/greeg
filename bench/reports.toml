timestamp_source = "measurement"
notes = "Atomic skill creation and legacy adoption add 6.9–8.2 ms at the median; managed/legacy removal adds 2.1–3.8 ms for snapshot checks, locking and directory sync. These exceed investigation thresholds and are an installation/removal reliability cost. Already-current skills remain near 4 ms without rewriting. The complete generated skill text increases from 789 to 840 o200k_base tokens for Claude and 764 to 818 for Codex (ownership marker only; not an agent-task savings measurement). Rust tests cover unsafe paths, conflicts and failed publication."

