# Agent-protocol tasks. Each task is a realistic coding-agent request on a
# pinned corpus, with a mechanical check on the agent's final answer
# (`answer.txt`, run in the run's directory). `answer` is a verified answer the
# check must pass; it fails with its line numbers taken out, and fails each
# `incomplete` answer. Arms:
#   A  no greeg:         rg and grep only, no greeg on PATH, no hook
#   B  greeg hook:       `greeg hook run` as the PreToolUse hook (rg rewritten, grep left alone)
#   C  hook and prompt:  as B, and the prompt starts with "Use greeg for code search."
#   S  hook and skill:   as B, and greeg's generated skill (what `greeg hook claude`
#                        installs) appended to the system prompt
# `run.py` runs them; see README.md. `held_out = true` marks a task greeg is
# not tuned on: `analyze.py` reports those apart, and a decision rests on them.

[[task]]
id = "tokio-joinhandle-abort"
corpus = "tokio"
prompt = "Find where JoinHandle::abort is implemented and list every public API that can cancel a spawned task. Answer with file:line for each."
check = "grep -q 'tokio/src/runtime/task/join.rs:[0-9]' answer.txt && grep -qi 'abort_handle\\|AbortHandle' answer.txt"
answer = "JoinHandle::abort at tokio/src/runtime/task/join.rs:227 cancels the task. Other public APIs: JoinHandle::abort_handle (tokio/src/runtime/task/join.rs:307) gives an AbortHandle, and AbortHandle::abort at tokio/src/runtime/task/abort.rs:53 cancels through it, JoinSet::abort_all at tokio/src/task/join_set.rs:463, and JoinSet::shutdown at tokio/src/task/join_set.rs:381, which aborts every task before waiting for them."
incomplete = ["JoinHandle::abort at tokio/src/runtime/task/join.rs:227."]

