held_out = true
prompt = "With tokio's default timer (no unstable features), trace what Sleep::reset does when the timer entry cannot simply be pushed later: list every function on the path from Sleep::reset down to the timer-wheel functions that take the entry out and put it back, with file:line for each, and name the method that is tried first to avoid touching the wheel."
check = "grep -Eq '(^|[^A-Za-z0-9_.-])sleep\\.rs:(342|343|344|345|346)([^0-9]|$)' answer.txt && grep -q 'reset' answer.txt && grep -Eq '(^|[^A-Za-z0-9_.-])runtime/mod\\.rs:(495|496|497|498|499)([^0-9]|$)' answer.txt && grep -Eq '(^|[^A-Za-z0-9_.-])entry\\.rs:(520|521|522|523|524)([^0-9]|$)' answer.txt && grep -Eq '(^|[^A-Za-z0-9_.-])entry\\.rs:(429|430|431|432|433)([^0-9]|$)' answer.txt && grep -Eq '(^|[^A-Za-z0-9_.-])time/mod\\.rs:(396|397|398|399|400)([^0-9]|$)' answer.txt && grep -Eq '(^|[^A-Za-z0-9_.-])wheel/mod\\.rs:(115|116|117|118|119)([^0-9]|$)' answer.txt && grep -Eq '(^|[^A-Za-z0-9_.-])wheel/mod\\.rs:(88|89|90|91|92)([^0-9]|$)' answer.txt && grep -q 'extend_expiration' answer.txt && grep -q 'reregister' answer.txt && grep -q 'remove' answer.txt && grep -q 'insert' answer.txt && tr '\\n' ' ' < answer.txt | grep -Eq 'Sleep.*TimerEntry.*reregister.*(remove|insert)'"
answer = "Sleep::reset at tokio/src/time/sleep.rs:344 calls Timer::reset at tokio/src/runtime/mod.rs:497, which calls TimerEntry::reset at tokio/src/runtime/time/entry.rs:522. That first tries TimerShared::extend_expiration at tokio/src/runtime/time/entry.rs:431, which only succeeds when the new deadline is later and the entry has not fired; otherwise it calls Handle::reregister at tokio/src/runtime/time/mod.rs:398, which takes the entry out with Wheel::remove at tokio/src/runtime/time/wheel/mod.rs:117 and puts it back with Wheel::insert at tokio/src/runtime/time/wheel/mod.rs:90."
incomplete = ["Sleep::reset at tokio/src/time/sleep.rs:344 calls TimerEntry::reset at tokio/src/runtime/time/entry.rs:522, which calls Handle::reregister at tokio/src/runtime/time/mod.rs:398 to move the entry in the wheel.", "Sleep::reset at tokio/src/time/sleep.rs:344 calls Timer::reset at tokio/src/runtime/mod.rs:497, then TimerEntry::reset at tokio/src/runtime/time/entry.rs:522, then Handle::reregister at tokio/src/runtime/time/mod.rs:398, which uses Wheel::remove at tokio/src/runtime/time/wheel/mod.rs:117 and Wheel::insert at tokio/src/runtime/time/wheel/mod.rs:90.", "Sleep::reset at tokio/src/time/sleep.rs:344 calls Timer::reset at tokio/src/runtime/mod.rs:497 and TimerEntry::reset at tokio/src/runtime/time/entry.rs:522, which tries TimerShared::extend_expiration at tokio/src/runtime/time/entry.rs:431 and then Handle::reregister at tokio/src/runtime/time/mod.rs:398, which re-inserts it with Wheel::insert at tokio/src/runtime/time/wheel/mod.rs:90.", "The path, from the bottom up: Wheel::insert at tokio/src/runtime/time/wheel/mod.rs:90, which is called by Wheel::remove at tokio/src/runtime/time/wheel/mod.rs:117, which is called by Handle::reregister at tokio/src/runtime/time/mod.rs:398, which is called by TimerShared::extend_expiration at tokio/src/runtime/time/entry.rs:431, which is called by TimerEntry::reset at tokio/src/runtime/time/entry.rs:522, which is called by Timer::reset at tokio/src/runtime/mod.rs:497, which is called by Sleep::reset at tokio/src/time/sleep.rs:344."]

