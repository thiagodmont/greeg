[[task]]
id = "coroutines-uncaught-exception-path"
corpus = "kotlinx-coroutines"
held_out = true
prompt = "A coroutine started with launch fails, and its context has no CoroutineExceptionHandler. On the JVM, trace where the exception goes: list each function from the coroutine's exception hook down to the function that hands it to the thread, with file:line each, and say where the extra global handlers it notifies first come from (file:line)."
