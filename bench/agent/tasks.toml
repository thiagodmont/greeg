# Agent-protocol tasks. Each task is a realistic coding-agent request on a
# pinned corpus, with a mechanical check on the agent's final answer
# (`answer.txt`, run in the run's directory). Arms:
#   A  rg only:          no greeg on PATH, no hook
#   B  greeg hook:       `greeg hook run` as the PreToolUse hook (rg/grep rewritten)
#   C  hook and prompt:  as B, and the prompt starts with "Use greeg for code search."
# `run.py` runs them; see README.md.

[[task]]
id = "tokio-joinhandle-abort"
corpus = "tokio"
prompt = "Find where JoinHandle::abort is implemented and list every public API that can cancel a spawned task. Answer with file:line for each."
check = "grep -q 'tokio/src/runtime/task/join.rs' answer.txt && grep -qi 'abort_handle\\|AbortHandle' answer.txt"
answer = "JoinHandle::abort at tokio/src/runtime/task/join.rs:227 cancels the task. Other public APIs: JoinHandle::abort_handle (tokio/src/runtime/task/join.rs:307) gives an AbortHandle whose abort is at tokio/src/runtime/task/abort.rs:53, and JoinSet::abort_all at tokio/src/task/join_set.rs:463."

[[task]]
id = "tokio-semaphore-permits"
corpus = "tokio"
prompt = "Which struct owns the permit count behind tokio::sync::Semaphore, and which method releases permits back? Give file:line for the struct and the method."
check = "grep -q 'batch_semaphore.rs' answer.txt && grep -q 'release' answer.txt"
answer = "The permit count lives in Semaphore at tokio/src/sync/batch_semaphore.rs:35; Semaphore::release at tokio/src/sync/batch_semaphore.rs:231 gives permits back."

[[task]]
id = "django-queryset-ordering"
corpus = "django"
prompt = "Where does ModelAdmin decide the ordering of its changelist queryset? Name the method and the file:line, and say which other method it calls to get the ordering."
check = "grep -q 'django/contrib/admin/options.py' answer.txt && grep -q 'get_ordering' answer.txt"
answer = "ChangeList.get_ordering at django/contrib/admin/views/main.py:375 decides it, calling ModelAdmin.get_ordering at django/contrib/admin/options.py:462."

[[task]]
id = "django-csrf-token"
corpus = "django"
prompt = "Trace how the csrf_token template tag obtains its value: list the functions involved from the template tag down to the function that reads the cookie, with file:line each."
check = "grep -q 'get_token' answer.txt && grep -q 'django/middleware/csrf.py' answer.txt"
answer = "csrf_token at django/template/defaulttags.py:705 builds CsrfTokenNode; the token comes from the csrf context processor (django/template/context_processors.py:19), which calls get_token at django/middleware/csrf.py:96; the cookie is read by CsrfViewMiddleware._get_secret at django/middleware/csrf.py:221."

[[task]]
id = "ktor-content-negotiation"
corpus = "ktor"
prompt = "Find the plugin that installs ContentNegotiation on the server side and list the converters it registers by default. Give file:line."
check = "grep -qi 'ContentNegotiation' answer.txt && grep -q 'ktor-server' answer.txt"
answer = "ContentNegotiation is created at ktor-server/ktor-server-plugins/ktor-server-content-negotiation/common/src/io/ktor/server/plugins/contentnegotiation/ContentNegotiation.kt:60; it registers no converters by default."

[[task]]
id = "ktor-respond-text"
corpus = "ktor"
prompt = "Which function implements ApplicationCall.respondText, and what ContentType does it default to? file:line please."
check = "grep -q 'respondText' answer.txt && grep -qi 'text/plain\\|Text.Plain' answer.txt"
answer = "ApplicationCall.respondText at ktor-server/ktor-server-core/common/src/io/ktor/server/response/ApplicationResponseFunctions.kt:124; the content type defaults to ContentType.Text.Plain."

[[task]]
id = "typescript-create-source-file"
corpus = "TypeScript-5.9"
prompt = "Where is createSourceFile defined in the compiler, and which function does it delegate parsing to? Give file:line for both."
check = "grep -q 'src/compiler/parser.ts' answer.txt && grep -q 'parseSourceFile' answer.txt"
answer = "createSourceFile at src/compiler/parser.ts:1344 delegates to Parser.parseSourceFile at src/compiler/parser.ts:1603."

[[task]]
id = "typescript-checker-entry"
corpus = "TypeScript-5.9"
prompt = "Which function is the entry point for type-checking a whole source file in the checker, and which function calls it? file:line for both."
check = "grep -q 'src/compiler/checker.ts' answer.txt && grep -q 'checkSourceFile' answer.txt"
answer = "checkSourceFile at src/compiler/checker.ts:49277, called by checkSourceFileWithEagerDiagnostics at src/compiler/checker.ts:49439."

[[task]]
id = "coroutines-dispatchers-default"
corpus = "kotlinx-coroutines"
prompt = "How is Dispatchers.Default implemented on the JVM: which class backs it and where is the thread count decided? file:line each."
check = "grep -q 'DefaultScheduler\\|CoroutineScheduler' answer.txt && grep -q 'jvm/src' answer.txt"
answer = "Dispatchers.Default is DefaultScheduler (kotlinx-coroutines-core/jvm/src/scheduling/Dispatcher.kt:9), backed by CoroutineScheduler; the thread count is CORE_POOL_SIZE at kotlinx-coroutines-core/jvm/src/scheduling/Tasks.kt:29."

[[task]]
id = "coroutines-launch"
corpus = "kotlinx-coroutines"
prompt = "Find the definition of CoroutineScope.launch and the coroutine class it instantiates. file:line for both."
check = "grep -q 'Builders.common.kt' answer.txt && grep -q 'StandaloneCoroutine\\|LazyStandaloneCoroutine' answer.txt"
answer = "CoroutineScope.launch at kotlinx-coroutines-core/common/src/Builders.common.kt:200 creates StandaloneCoroutine (Builders.common.kt:519), or LazyStandaloneCoroutine when lazy."
